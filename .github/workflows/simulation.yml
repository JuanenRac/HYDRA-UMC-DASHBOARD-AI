#
# Runs the forecast, the geometry of the small chart and the verifier of the numbers of a narrative against the history of a simulated plant (a generator with a
# fixed seed). See docs/SIMULATION.md.
# =============================================================================
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: Run the simulated histories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install the dependencies
        run: npm ci --ignore-scripts
      - name: Run the simulation bench
        run: npx vitest run tests/simulationBench.test.ts
